<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Georgian (U+10A0..10FF) has no glyphs in most programming fonts, so
       apps fall back to Noto Sans Georgian, which is proportional. Inside a
       terminal's fixed cell grid those glyphs collide. DejaVu Sans Mono is a
       true monospace face (spacing=100) with full Georgian coverage, so route
       every monospace request for Georgian to it. -->

  <!-- Generic: any pattern that asks for monospace spacing. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ka</string></test>
    <test name="spacing" compare="eq"><const>mono</const></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Generic aliases. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ka</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Named monospace families that lack Georgian: append DejaVu Sans Mono so
       it wins the fallback over the proportional Georgian faces. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>JetBrains Mono</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Fira Code</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hack</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Source Code Pro</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cousine</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
</fontconfig>
